<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MMC CL 08-26 — 150 Question Practice Questionnaire</title>
<style>
:root{--bg:#0b1220;--card:#111827;--card2:#172033;--text:#f8fafc;--muted:#94a3b8;--line:#334155;--accent:#38bdf8;--good:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07101e,#111827 55%,#0b1220);color:var(--text);font-family:Segoe UI,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:28px 18px 55px}.card{background:rgba(17,24,39,.96);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 20px 60px #0005}
h1{font-size:clamp(25px,4vw,40px);margin:0 0 8px}.sub{color:var(--muted);line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.stat{background:#0a1220;border:1px solid var(--line);border-radius:12px;padding:13px}.stat b{font-size:21px;display:block}.stat span{color:var(--muted);font-size:12px}
.progress{height:9px;background:#1e293b;border-radius:999px;overflow:hidden;margin:18px 0 25px}.progress i{display:block;height:100%;background:var(--accent)}
.top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px}.q{font-size:21px;line-height:1.5;margin:20px 0}
.choice{width:100%;display:flex;gap:12px;text-align:left;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0;font-size:16px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}.choice.correct{border-color:var(--good);background:#092516}.choice.wrong{border-color:var(--bad);background:#320d14}
.choice:disabled{cursor:default}.letter{font-weight:800;min-width:25px}.feedback{display:none;padding:14px;border-radius:12px;margin-top:16px}
.feedback.good{display:block;background:#092516;border:1px solid var(--good)}.feedback.bad{display:block;background:#320d14;border:1px solid var(--bad)}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
button{background:#1e293b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
button.primary{background:var(--accent);color:#06202b;border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}
select{background:#0a1220;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}
.center{text-align:center}.score{font-size:58px;font-weight:900;margin:12px}.small{font-size:12px;color:var(--muted)}
.review{margin-top:22px;text-align:left;max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.review div{padding:13px;border-bottom:1px solid var(--line)}.review div:last-child{border:0}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.controls{flex-direction:column}.controls button{width:100%}.q{font-size:18px}}
</style>
</head>

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-0.5);

function home(){
app.innerHTML=`<div class="center">
<h1>MMC CL 08-26 Practice Online Questionnaire</h1>
<p class="sub">All <b>${BANK.length}</b> multiple-choice questions from the supplied answered question bank are included.</p>
<div class="stats"><div class="stat"><b>150</b><span>Total Questions</span></div><div class="stat"><b>60</b><span>Block 1</span></div><div class="stat"><b>60</b><span>Block 2</span></div><div class="stat"><b>30</b><span>Block 3</span></div></div>
<label>Practice length:&nbsp;<select id="length"><option value="10">10 Questions</option><option value="20">20 Questions</option><option value="30">30 Questions</option><option value="50">50 Questions</option><option value="all">All 150 Questions</option></select></label><br><br>
<button class="primary" onclick="start()">Start Practice</button>
<p class="small">Question wording, choices, terminology, and answer key are based on the uploaded bank. Choices are shuffled for practice.</p>
</div>`;
}
function start(){let n=document.getElementById("length").value;n=n==="all"?BANK.length:Number(n);pool=shuffle(BANK).slice(0,n).map(q=>({...q,choices:shuffle(q.choices)}));idx=0;score=0;answered=false;results=[];render();}
function render(){
let q=pool[idx],pct=idx/pool.length*100;
app.innerHTML=`<div class="top"><span>Question ${idx+1} of ${pool.length}</span><span>${q.block} • Original #${q.number}</span></div>
<div class="progress"><i style="width:${pct}%"></i></div><div class="q">${esc(q.question)}</div>
<div>${q.choices.map(c=>`<button class="choice" data-letter="${c.letter}" onclick="answer('${c.letter}')"><span class="letter">${c.letter}.</span><span>${esc(c.text)}</span></button>`).join("")}</div>
<div id="fb" class="feedback"></div><div class="controls"><button onclick="home()">Restart</button><button id="next" class="primary" disabled onclick="next()">${idx===pool.length-1?"Finish":"Next Question"}</button></div>`;
}
function answer(letter){
if(answered)return;answered=true;let q=pool[idx],ok=letter===q.answer;if(ok)score++;results.push({q,chosen:letter,ok});
document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.dataset.letter===q.answer)b.classList.add("correct");if(b.dataset.letter===letter&&!ok)b.classList.add("wrong")});
let fb=document.getElementById("fb");fb.className="feedback "+(ok?"good":"bad");fb.innerHTML=`<b>${ok?"Correct ✓":"Incorrect ✗"}</b><div>Correct answer: <b>${q.answer}</b> — ${esc(q.choices.find(c=>c.letter===q.answer).text)}</div>`;
document.getElementById("next").disabled=false;
}
function next(){if(!answered)return;if(idx<pool.length-1){idx++;answered=false;render()}else result()}
function result(){
let pct=score/pool.length*100,perf=pct>=90?"Excellent performance.":pct>=80?"Very good performance.":pct>=75?"Good performance.":pct>=60?"Passing-range practice result; review missed items.":"Further review is recommended.";
app.innerHTML=`<div class="center"><h1>Practice Complete</h1><div class="score">${score}/${pool.length}</div><h2>${pct.toFixed(2)}%</h2><p class="sub">${perf}</p>
<div class="stats"><div class="stat"><b>${score}</b><span>Correct</span></div><div class="stat"><b>${pool.length-score}</b><span>Incorrect</span></div><div class="stat"><b>${pct.toFixed(1)}%</b><span>Score</span></div><div class="stat"><b>${new Set(pool.map(q=>q.block)).size}</b><span>Blocks</span></div></div>
<button class="primary" onclick="home()">Take Another Practice</button> <button onclick="review()">Review Answers</button><div id="rev"></div></div>`;
}
function review(){document.getElementById("rev").innerHTML=`<div class="review">${results.map((r,i)=>`<div><b>${i+1}. ${esc(r.q.question)}</b><br>Your answer: <b>${r.chosen}</b> — ${esc(r.q.choices.find(c=>c.letter===r.chosen).text)}<br>Correct: <b>${r.q.answer}</b> — ${esc(r.q.choices.find(c=>c.letter===r.q.answer).text)}</div>`).join("")}</div>`;}
home();
</script></body></html>
